# On a push to main that changes the site (or a manual run): check types, run the tests,
# build the site and publish it on GitHub Pages. Pushes that only touch the docs or the
# Osty files (README, ROADMAP, NOTES, …) run nothing.
# (Repository settings → Pages → Source: "GitHub Actions".)
name: Test and deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "test/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
